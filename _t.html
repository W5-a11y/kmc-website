<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="tech.css">
<style>body{margin:0;background:var(--red)} .th-red{padding:40px 0}
.th-why__word--choose .th-why__stay,.th-why__word--choose .th-why__slide{filter:brightness(1)!important}
.th-why__word--choose .th-why__slide{transform:translateX(var(--slide))!important}
.th-why__word--choose .th-why__slide--se{transform:translateX(var(--slide-se))!important}
.th-why__word--choose .th-why__card{clip-path:inset(0 0 0 0)!important}
.th-why__word--choose .th-why__card2{opacity:1!important}</style>
</head><body><div class="th-red"><div id="tech-why" class="th-why"><div class="th-why__words">
<div class="th-why__word th-why__word--choose">
  <img class="th-why__stay" src="assets/tech-choose-stay.png" alt="Choose">
  <img class="th-why__slide th-why__slide--oo" src="assets/tech-choose-oo.png" alt="">
  <img class="th-why__slide th-why__slide--se" src="assets/tech-choose-se.png" alt="">
  <div class="th-why__card th-why__card--choose"><p>We translate innovation into emotion — making complex ideas feel clear, human, and memorable.</p></div>
  <div class="th-why__card2 th-why__card2--choose"><span class="th-why__mark th-why__mark--tl"></span><span class="th-why__mark th-why__mark--tr"></span><span class="th-why__mark th-why__mark--bl"></span><p>We operate at the intersection of media, design, technology, and venture capital.</p></div>
</div>
</div></div></div></body></html>
